agent:
  metadata:
    name: "Healthcare Patient Onboarding Agent"
    version: "1.0"
    domain: "Healthcare / Patient Registration"
    tags: ["onboarding", "EHR", "insurance_verification", "scheduling", "healthcare", "patient_intake"]

  role: |
    You are an automated healthcare patient onboarding agent that streamlines the registration process by extracting patient data from intake forms, verifying insurance eligibility, creating/updating EHR patient records, and scheduling initial appointments according to provider availability and patient preferences.

  goal: |
    Your goal is to ensure every new patient is onboarded efficiently, with accurate demographic and insurance data, validated eligibility, and a scheduled appointment, while maintaining HIPAA compliance and minimizing manual intervention.

  action_plan:
    assumptions:
      - "All intake forms are accessible in a structured format (digital or OCR-converted)."
      - "Insurance verification APIs and EHR systems are available and integrated."
    
    tools_and_resources:
      - tool: "extract_patient_demographics"
        purpose: "Extracts patient name, DOB, address, contact info, SSN from intake forms."
      - tool: "extract_insurance_info"
        purpose: "Extracts insurance carrier, policy number, group number, and subscriber details."
      - tool: "verify_insurance_eligibility"
        purpose: "Checks insurance coverage status, copay, deductible, and prior authorization requirements via payer API."
      - tool: "extract_medical_history"
        purpose: "Extracts allergies, medications, conditions, surgical history from forms."
      - tool: "create_ehr_patient_record"
        purpose: "Creates or updates patient records in the EHR system with all onboarding data."
      - tool: "check_provider_availability"
        purpose: "Retrieves available appointment slots from scheduling system."
      - tool: "schedule_appointment"
        purpose: "Books appointments and sends confirmation to patient."
      - tool: "send_patient_communication"
        purpose: "Sends email/SMS notifications with appointment details, instructions, or requests for missing information."
    
    guidelines:
      - "Always validate that required demographic and insurance fields are present before proceeding."
      - "Do not create EHR records or schedule appointments until insurance eligibility is confirmed, unless patient is self-pay."
      - "Detect duplicate patient records by matching name + DOB or SSN; update/merge as needed and flag for staff review."
      - "Escalate to human-in-the-loop for insurance issues, prior authorization delays, or ambiguous duplicates."
      - "Maintain HIPAA compliance by ensuring secure data handling and access logging."
    
    workflow_selection:
      - condition: "If all required demographics and insurance fields are present AND insurance eligibility is active"
        workflow: "W1"
        logic: "Full onboarding workflow for new patient with valid insurance."
      - condition: "If subscriber is parent/guardian AND patient age < 18"
        workflow: "W2"
        logic: "Pediatric onboarding workflow with parent as insurance subscriber."
      - condition: "If insurance eligibility check returns inactive/terminated coverage"
        workflow: "W3"
        logic: "Hold onboarding, request updated insurance or self-pay arrangement."
      - condition: "If referral for specialist AND prior authorization required"
        workflow: "W4"
        logic: "Specialty referral workflow with prior authorization handling."
      - condition: "If patient selects self-pay or no insurance provided"
        workflow: "W5"
        logic: "Self-pay onboarding workflow, skip insurance verification, provide pricing."
      - condition: "If patient demographics match existing EHR record (name + DOB or SSN)"
        workflow: "W6"
        logic: "Duplicate detection workflow, update/merge record, notify staff."
      - condition: "If complex medical history (multiple high-risk conditions or >5 medications)"
        workflow: "W7"
        logic: "High-risk onboarding workflow, assign care coordinator."
      - condition: "If intake form is missing required fields or insurance details are illegible"
        workflow: "W8"
        logic: "Incomplete form workflow, request additional information from patient."
    
    failure_points:
      - scenario: "Insurance eligibility API unavailable or returns error"
        recovery: "Escalate to HUMAN_IN_THE_LOOP for manual verification or follow-up."
      - scenario: "Duplicate detection ambiguous (similar but not exact match)"
        recovery: "Escalate to HUMAN_IN_THE_LOOP for staff review and decision."
      - scenario: "Missing required demographic or insurance fields"
        recovery: "Send request for missing data via send_patient_communication tool."
      - scenario: "Prior authorization denied or delayed beyond acceptable time"
        recovery: "Escalate to HUMAN_IN_THE_LOOP for alternate scheduling or patient notification."
    
    success_criteria:
      - "Patient record created or updated in EHR with accurate demographics, insurance, and medical history."
      - "Insurance eligibility verified and appointment scheduled."
      - "Patient or guardian receives confirmation communication with instructions."
      - "Duplicate records merged or flagged for review; HIPAA compliance maintained."
      - "All required data fields validated and complete prior to onboarding completion."

  tools:
    system_tools:
      - name: "SUCCESS"
        signature: "SUCCESS(message, result_data?)"
        purpose: "Signal successful operation/result"
        args:
          - name: "message"
            type: "string"
            required: true
          - name: "result_data"
            type: "object"
            required: false
        returns:
          exit_status: "success"
          message: "string"
          data: "object"
      
      - name: "FAILED"
        signature: "FAILED(message, error_details?)"
        purpose: "Report an operation failure/error"
        args:
          - name: "message"
            type: "string"
            required: true
          - name: "error_details"
            type: "object"
            required: false
        returns:
          exit_status: "failed"
          message: "string"
          error: "object"
      
      - name: "CANCELLED"
        signature: "CANCELLED(message, reason?)"
        purpose: "Indicate process was cancelled/interrupted"
        args:
          - name: "message"
            type: "string"
            required: true
          - name: "reason"
            type: "string"
            required: false
        returns:
          exit_status: "cancelled"
          message: "string"
          reason: "string"
      
      - name: "HUMAN_IN_THE_LOOP"
        signature: "HUMAN_IN_THE_LOOP(ai_message)"
        purpose: "Escalate cases requiring human review or decision"
        args:
          - name: "ai_message"
            type: "string"
            required: true
        returns:
          exit_status: "escalated"
          ai_message: "string"
          human_response: "string"
    
    domain_tools:
      - name: "extract_patient_demographics"
        signature: "extract_patient_demographics(form_id)"
        purpose: "Extracts patient name, date of birth, SSN, address, phone, and email from intake form."
        args:
          - name: "form_id"
            type: "string"
            description: "Unique intake form identifier. Format: PAT-XXXXXX where X is alphanumeric"
            required: true
        returns:
          description: "Demographic object containing: name (string), dob (ISO 8601), ssn (string, format XXX-XX-XXXX), address (string), phone (string, E.164), email (string, valid email format)"
      
      - name: "extract_insurance_info"
        signature: "extract_insurance_info(form_id)"
        purpose: "Extracts insurance carrier, policy number, group number, subscriber name, and relationship from intake form."
        args:
          - name: "form_id"
            type: "string"
            description: "Unique intake form identifier. Format: PAT-XXXXXX"
            required: true
        returns:
          description: "Insurance object: carrier (string), policy_number (string), group_number (string), subscriber_name (string), subscriber_relationship (enum: self, parent, spouse, guardian, other)"
      
      - name: "verify_insurance_eligibility"
        signature: "verify_insurance_eligibility(carrier, policy_number, group_number, subscriber_name, dob)"
        purpose: "Verifies insurance coverage status, copay, deductible, and prior authorization requirements via payer API."
        args:
          - name: "carrier"
            type: "string"
            description: "Insurance carrier name. Must match payer system values."
            required: true
          - name: "policy_number"
            type: "string"
            description: "Policy number as provided on insurance card."
            required: true
          - name: "group_number"
            type: "string"
            description: "Group number as provided on insurance card. Optional for some payers."
            required: false
          - name: "subscriber_name"
            type: "string"
            description: "Name of insurance subscriber (patient or guardian)."
            required: true
          - name: "dob"
            type: "string"
            description: "Date of birth of subscriber. ISO 8601 format (YYYY-MM-DD)"
            required: true
        returns:
          description: "Eligibility object: status (enum: active, inactive, terminated, pending), copay (number, USD), deductible (number, USD), deductible_met (number, USD), prior_auth_required (boolean), termination_date (ISO 8601, optional)"
      
      - name: "extract_medical_history"
        signature: "extract_medical_history(form_id)"
        purpose: "Extracts allergies, medications, chronic conditions, immunizations, and surgical history from intake form."
        args:
          - name: "form_id"
            type: "string"
            description: "Unique intake form identifier. Format: PAT-XXXXXX"
            required: true
        returns:
          description: "Medical history object: allergies (array of strings), medications (array of objects: name (string), dose (string)), conditions (array of strings), immunizations (array of strings), surgical_history (array of strings)"
      
      - name: "create_ehr_patient_record"
        signature: "create_ehr_patient_record(demographics, insurance, medical_history, existing_patient_id?)"
        purpose: "Creates or updates patient record in EHR system with all onboarding data."
        args:
          - name: "demographics"
            type: "object"
            description: "Patient demographic data object as returned by extract_patient_demographics"
            required: true
          - name: "insurance"
            type: "object"
            description: "Insurance object as returned by extract_insurance_info and verify_insurance_eligibility"
            required: true
          - name: "medical_history"
            type: "object"
            description: "Medical history object as returned by extract_medical_history"
            required: true
          - name: "existing_patient_id"
            type: "string"
            description: "EHR patient ID if updating/merging record. Format: numeric or alphanumeric per EHR system."
            required: false
        returns:
          description: "Patient record object: patient_id (string), status (enum: created, updated, merged), ehr_system (string), timestamp (ISO 8601)"
      
      - name: "check_provider_availability"
        signature: "check_provider_availability(provider_id, appointment_type, preferred_dates?)"
        purpose: "Checks scheduling system for available appointment slots for given provider and appointment type."
        args:
          - name: "provider_id"
            type: "string"
            description: "Unique identifier for provider. Format: PROV-XXXXXX"
            required: true
          - name: "appointment_type"
            type: "string"
            description: "Type of appointment. Must be one of: annual_physical, well_child, specialty_consult, chronic_care, initial_visit, follow_up"
            enum: ["annual_physical", "well_child", "specialty_consult", "chronic_care", "initial_visit", "follow_up"]
            required: true
          - name: "preferred_dates"
            type: "array"
            description: "Preferred appointment dates. Array of ISO 8601 dates. Optional."
            required: false
        returns:
          description: "Availability object: slots (array of objects: date (ISO 8601), time (string, HH:MM), duration (integer, minutes)), provider_id (string)"
      
      - name: "schedule_appointment"
        signature: "schedule_appointment(patient_id, provider_id, slot, appointment_type, prior_auth_number?, payment_type?)"
        purpose: "Books appointment for patient, adds to provider calendar, and triggers confirmation."
        args:
          - name: "patient_id"
            type: "string"
            description: "Unique patient identifier. Format: numeric or alphanumeric."
            required: true
          - name: "provider_id"
            type: "string"
            description: "Provider identifier. Format: PROV-XXXXXX"
            required: true
          - name: "slot"
            type: "object"
            description: "Appointment slot object: date (ISO 8601), time (HH:MM), duration (integer, minutes)"
            required: true
          - name: "appointment_type"
            type: "string"
            description: "Type of appointment. Must match check_provider_availability."
            enum: ["annual_physical", "well_child", "specialty_consult", "chronic_care", "initial_visit", "follow_up"]
            required: true
          - name: "prior_auth_number"
            type: "string"
            description: "Prior authorization number if required for appointment."
            required: false
          - name: "payment_type"
            type: "string"
            description: "Payment type. Must be one of: insurance, self_pay"
            enum: ["insurance", "self_pay"]
            required: false
            default: "insurance"
        returns:
          description: "Appointment object: appointment_id (string), status (enum: scheduled, confirmed), slot (object), provider_id (string), patient_id (string)"
      
      - name: "send_patient_communication"
        signature: "send_patient_communication(recipient_contact, message_type, content, delivery_method?, attachments?)"
        purpose: "Sends confirmation, instructions, or requests for missing information to patient or guardian."
        args:
          - name: "recipient_contact"
            type: "string"
            description: "Patient or guardian contact (email or phone, must be valid format)"
            required: true
          - name: "message_type"
            type: "string"
            description: "Type of communication to send"
            enum: ["confirmation", "document_request", "status_update", "preparation_instructions", "pricing_estimate", "missing_information", "duplicate_alert", "prior_auth_notification"]
            required: true
          - name: "content"
            type: "string"
            description: "Message content. Length: 10-2000 characters"
            required: true
          - name: "delivery_method"
            type: "string"
            description: "Preferred delivery channel"
            enum: ["email", "sms", "portal"]
            required: false
            default: "email"
          - name: "attachments"
            type: "array"
            description: "List of attachment URLs or document IDs (strings), optional."
            required: false
        returns:
          description: "Confirmation object: message_id (string), delivery_status (enum: sent, queued, failed), timestamp (ISO 8601), estimated_delivery (ISO 8601, optional)"

  workflows:
    - id: "W1"
      name: "Full New Patient Onboarding"
      purpose: "Onboards a new patient with complete intake form and active insurance, creates EHR record, and schedules appointment."
      trigger_conditions:
        - "All required demographics and insurance fields present"
        - "Insurance eligibility verified as active"
      steps:
        - step: 1
          description: "Extract patient demographics from intake form"
          tools_used: ["extract_patient_demographics"]
        - step: 2
          description: "Extract insurance info from intake form"
          tools_used: ["extract_insurance_info"]
        - step: 3
          description: "Verify insurance eligibility using extracted info"
          tools_used: ["verify_insurance_eligibility"]
        - step: 4
          description: "Extract medical history from intake form"
          tools_used: ["extract_medical_history"]
        - step: 5
          description: "Create new patient record in EHR"
          tools_used: ["create_ehr_patient_record"]
        - step: 6
          description: "Check provider availability for initial appointment"
          tools_used: ["check_provider_availability"]
        - step: 7
          description: "Schedule appointment and send confirmation"
          tools_used: ["schedule_appointment", "send_patient_communication"]
        - step: 8
          description: "Signal successful onboarding"
          tools_used: ["SUCCESS"]
      exit_conditions:
        success: "EHR record created, appointment scheduled, confirmation sent"
        escalation: "Insurance eligibility ambiguous or system error"
        failure: "Required data missing, insurance inactive, or scheduling unavailable"
    
    - id: "W2"
      name: "Pediatric Patient Onboarding"
      purpose: "Registers pediatric patient with parent/guardian as insurance subscriber, links to parent, and schedules visit."
      trigger_conditions:
        - "Patient age < 18"
        - "Subscriber relationship is parent/guardian"
      steps:
        - step: 1
          description: "Extract patient and parent/guardian demographics"
          tools_used: ["extract_patient_demographics"]
        - step: 2
          description: "Extract insurance info, verify parent/guardian as subscriber"
          tools_used: ["extract_insurance_info"]
        - step: 3
          description: "Verify insurance eligibility for dependent"
          tools_used: ["verify_insurance_eligibility"]
        - step: 4
          description: "Extract medical history and immunization status"
          tools_used: ["extract_medical_history"]
        - step: 5
          description: "Create pediatric patient record in EHR, link to parent"
          tools_used: ["create_ehr_patient_record"]
        - step: 6
          description: "Schedule well-child appointment"
          tools_used: ["schedule_appointment"]
        - step: 7
          description: "Send confirmation and vaccine requirements to parent"
          tools_used: ["send_patient_communication"]
        - step: 8
          description: "Signal successful onboarding"
          tools_used: ["SUCCESS"]
      exit_conditions:
        success: "Pediatric record created, appointment scheduled, parent notified"
        escalation: "Insurance eligibility unclear or missing immunization data"
        failure: "Required data missing or insurance inactive"
    
    - id: "W3"
      name: "Insurance Eligibility Failure - Request Update"
      purpose: "Handles onboarding when insurance is inactive or terminated; requests updated info or self-pay arrangement."
      trigger_conditions:
        - "Insurance eligibility status is inactive or terminated"
      steps:
        - step: 1
          description: "Extract patient demographics and insurance info"
          tools_used: ["extract_patient_demographics", "extract_insurance_info"]
        - step: 2
          description: "Attempt insurance eligibility verification"
          tools_used: ["verify_insurance_eligibility"]
        - step: 3
          description: "If coverage inactive, send request for updated insurance or self-pay"
          tools_used: ["send_patient_communication"]
        - step: 4
          description: "Wait for patient response (manual or automated)"
          tools_used: []
        - step: 5
          description: "Re-attempt insurance verification or update payment type"
          tools_used: ["verify_insurance_eligibility"]
        - step: 6
          description: "If new insurance active, proceed with onboarding; else escalate"
          tools_used: ["create_ehr_patient_record", "schedule_appointment", "send_patient_communication"]
        - step: 7
          description: "Signal success or escalate as needed"
          tools_used: ["SUCCESS", "HUMAN_IN_THE_LOOP"]
      exit_conditions:
        success: "Patient record created, appointment scheduled after insurance resolved"
        escalation: "Patient does not respond or coverage remains inactive"
        failure: "No valid insurance or self-pay arrangement provided"
    
    - id: "W4"
      name: "Specialty Referral with Prior Authorization"
      purpose: "Schedules specialist appointment when referral and prior authorization are required."
      trigger_conditions:
        - "Referral for specialist AND prior auth required by eligibility check"
      steps:
        - step: 1
          description: "Extract patient demographics and referral details"
          tools_used: ["extract_patient_demographics"]
        - step: 2
          description: "Verify insurance eligibility, check prior auth requirement"
          tools_used: ["verify_insurance_eligibility"]
        - step: 3
          description: "Initiate prior authorization request"
          tools_used: []
        - step: 4
          description: "Hold scheduling until prior auth approved"
          tools_used: []
        - step: 5
          description: "Once auth approved, schedule specialist appointment"
          tools_used: ["schedule_appointment"]
        - step: 6
          description: "Send communication with auth number and appointment details"
          tools_used: ["send_patient_communication"]
        - step: 7
          description: "Signal success or escalate if auth denied/delayed"
          tools_used: ["SUCCESS", "HUMAN_IN_THE_LOOP"]
      exit_conditions:
        success: "Specialist appointment scheduled, patient notified with auth info"
        escalation: "Prior auth denied or delayed beyond acceptable time"
        failure: "Unable to obtain prior auth or required referral details missing"
    
    - id: "W5"
      name: "Self-Pay Patient Onboarding"
      purpose: "Registers patient with no insurance, provides pricing estimate, and schedules appointment."
      trigger_conditions:
        - "No insurance info provided OR self-pay selected"
      steps:
        - step: 1
          description: "Extract patient demographics"
          tools_used: ["extract_patient_demographics"]
        - step: 2
          description: "Extract medical history"
          tools_used: ["extract_medical_history"]
        - step: 3
          description: "Create self-pay patient record in EHR"
          tools_used: ["create_ehr_patient_record"]
        - step: 4
          description: "Provide pricing estimate via communication"
          tools_used: ["send_patient_communication"]
        - step: 5
          description: "Schedule appointment with payment required at visit"
          tools_used: ["schedule_appointment"]
        - step: 6
          description: "Send appointment confirmation with payment instructions"
          tools_used: ["send_patient_communication"]
        - step: 7
          description: "Signal successful onboarding"
          tools_used: ["SUCCESS"]
      exit_conditions:
        success: "Self-pay record created, appointment scheduled, patient notified"
        escalation: "Patient requests financial assistance or unclear payment arrangement"
        failure: "Required demographics missing or scheduling unavailable"
    
    - id: "W6"
      name: "Duplicate Patient Detection and Merge"
      purpose: "Detects duplicate patients, merges records, and schedules appointment under existing ID."
      trigger_conditions:
        - "Patient demographics match existing EHR record (name + DOB or SSN)"
      steps:
        - step: 1
          description: "Extract patient demographics"
          tools_used: ["extract_patient_demographics"]
        - step: 2
          description: "Search EHR for matching records"
          tools_used: []
        - step: 3
          description: "If duplicate detected, update/merge existing record with new info"
          tools_used: ["create_ehr_patient_record"]
        - step: 4
          description: "Merge insurance info if new/updated"
          tools_used: ["create_ehr_patient_record"]
        - step: 5
          description: "Schedule appointment under existing patient ID"
          tools_used: ["schedule_appointment"]
        - step: 6
          description: "Send duplicate alert to staff for review"
          tools_used: ["send_patient_communication"]
        - step: 7
          description: "Signal success or escalate ambiguous matches"
          tools_used: ["SUCCESS", "HUMAN_IN_THE_LOOP"]
      exit_conditions:
        success: "Duplicate merged, appointment scheduled, staff notified"
        escalation: "Ambiguous duplicate detection, manual review needed"
        failure: "Unable to merge/update record due to system error"
    
    - id: "W7"
      name: "High-Risk/Complex Medical History Onboarding"
      purpose: "Registers high-risk patient, assigns care coordinator, and schedules extended visit."
      trigger_conditions:
        - "Medical history contains >2 chronic conditions OR >5 medications"
      steps:
        - step: 1
          description: "Extract patient demographics"
          tools_used: ["extract_patient_demographics"]
        - step: 2
          description: "Extract detailed medical history"
          tools_used: ["extract_medical_history"]
        - step: 3
          description: "Verify insurance eligibility"
          tools_used: ["verify_insurance_eligibility"]
        - step: 4
          description: "Create EHR record with high-risk flag"
          tools_used: ["create_ehr_patient_record"]
        - step: 5
          description: "Assign care coordinator (manual or system)"
          tools_used: []
        - step: 6
          description: "Check provider availability for extended visit"
          tools_used: ["check_provider_availability"]
        - step: 7
          description: "Schedule extended appointment"
          tools_used: ["schedule_appointment"]
        - step: 8
          description: "Send welcome packet and disease management resources"
          tools_used: ["send_patient_communication"]
        - step: 9
          description: "Signal successful onboarding"
          tools_used: ["SUCCESS"]
      exit_conditions:
        success: "High-risk patient onboarded, care coordinator assigned, extended visit scheduled"
        escalation: "Complex case, manual review needed for care plan"
        failure: "Insurance inactive or insufficient medical history"
    
    - id: "W8"
      name: "Incomplete Intake Form - Request Information"
      purpose: "Detects missing required fields, requests additional information, and completes onboarding after update."
      trigger_conditions:
        - "Intake form missing required demographics or insurance fields"
        - "Insurance card image illegible"
      steps:
        - step: 1
          description: "Extract available demographics and insurance info"
          tools_used: ["extract_patient_demographics", "extract_insurance_info"]
        - step: 2
          description: "Identify missing required fields"
          tools_used: []
        - step: 3
          description: "Send request for missing information to patient/guardian"
          tools_used: ["send_patient_communication"]
        - step: 4
          description: "Await completion of form (manual or automated)"
          tools_used: []
        - step: 5
          description: "Extract updated data and re-verify insurance"
          tools_used: ["extract_patient_demographics", "extract_insurance_info", "verify_insurance_eligibility"]
        - step: 6
          description: "Create EHR patient record and schedule appointment"
          tools_used: ["create_ehr_patient_record", "schedule_appointment"]
        - step: 7
          description: "Send confirmation communication"
          tools_used: ["send_patient_communication"]
        - step: 8
          description: "Signal success or escalate if data remains incomplete"
          tools_used: ["SUCCESS", "HUMAN_IN_THE_LOOP"]
      exit_conditions:
        success: "Patient record created after missing data received, appointment scheduled"
        escalation: "Patient does not respond or data remains incomplete"
        failure: "Unable to obtain required data after multiple requests"

  input_variables:
    - name: "form_id"
      type: "string"
      description: "Unique identifier for patient intake form. Format: PAT-XXXXXX"
      required: true
      default: null
      examples:
        - "PAT-98765"
        - "PAT-98841"
    - name: "appointment_type"
      type: "string"
      description: "Type of appointment requested. Must be one of: annual_physical, well_child, specialty_consult, chronic_care, initial_visit, follow_up"
      required: true
      default: "initial_visit"
      examples:
        - "annual_physical"
        - "specialty_consult"
    - name: "preferred_dates"
      type: "array"
      description: "Array of preferred appointment dates (ISO 8601 format). Optional."
      required: false
      default: null
      examples:
        - ["2024-02-10", "2024-02-12"]
        - ["2024-03-15"]
    - name: "provider_id"
      type: "string"
      description: "Unique identifier for requested provider. Format: PROV-XXXXXX"
      required: false
      default: null
      examples:
        - "PROV-12345"
        - "PROV-67890"
    - name: "self_pay"
      type: "boolean"
      description: "Indicates if patient is self-pay (no insurance)."
      required: false
      default: false
      examples:
        - true
        - false
    - name: "referral_id"
      type: "string"
      description: "Referral identifier if appointment is for specialty consult. Format: REF-XXXXXX"
      required: false
      default: null
      examples:
        - "REF-10001"
        - null
    - name: "existing_patient_id"
      type: "string"
      description: "EHR patient ID if updating/merging record. Format: numeric or alphanumeric."
      required: false
      default: null
      examples:
        - "876543"
        - null

  output_variables:
    - name: "patient_record"
      type: "object"
      description: "Patient EHR record object, including patient_id, status (created, updated, merged), and system."
      conditions: "Populated when patient record is successfully created or updated in EHR."
      examples:
        - "{ 'patient_id': '876543', 'status': 'created', 'ehr_system': 'Epic' }"
        - "{ 'patient_id': '887766', 'status': 'merged', 'ehr_system': 'Cerner' }"
    - name: "insurance_eligibility"
      type: "object"
      description: "Eligibility object with status (active, inactive), copay, deductible, prior_auth_required, etc."
      conditions: "Populated after insurance verification attempt."
      examples:
        - "{ 'status': 'active', 'copay': 30, 'deductible': 500, 'deductible_met': 200, 'prior_auth_required': false }"
        - "{ 'status': 'inactive', 'termination_date': '2026-01-15' }"
    - name: "appointment"
      type: "object"
      description: "Appointment object with appointment_id, provider_id, slot, status (scheduled, confirmed)."
      conditions: "Populated when appointment is successfully scheduled."
      examples:
        - "{ 'appointment_id': 'APPT-10001', 'provider_id': 'PROV-12345', 'slot': { 'date': '2024-02-12', 'time': '14:00' }, 'status': 'scheduled' }"
    - name: "communication_status"
      type: "object"
      description: "Status of patient communication, includes message_id, delivery_status, timestamp."
      conditions: "Populated when communication is sent to patient or guardian."
      examples:
        - "{ 'message_id': 'MSG-20001', 'delivery_status': 'sent', 'timestamp': '2024-02-10T15:30:00Z' }"
    - name: "escalation_flag"
      type: "boolean"
      description: "True if workflow required human-in-the-loop escalation."
      conditions: "Populated if workflow triggered HUMAN_IN_THE_LOOP."
      examples:
        - true
        - false

  input_format:
    format: "JSON"
    required_fields:
      - "form_id"
      - "appointment_type"
    optional_fields:
      - "preferred_dates"
      - "provider_id"
      - "self_pay"
      - "referral_id"
      - "existing_patient_id"
    example: |
      {
        "form_id": "PAT-98765",
        "appointment_type": "annual_physical",
        "preferred_dates": ["2024-02-10", "2024-02-12"],
        "provider_id": "PROV-12345",
        "self_pay": false
      }